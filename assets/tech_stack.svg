<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="420">
  <defs>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <linearGradient id="mobile-badge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#02569b" />
      <stop offset="100%" stop-color="#0175c2" />
    </linearGradient>

    <linearGradient id="web-badge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f3460" />
      <stop offset="100%" stop-color="#16213e" />
    </linearGradient>

    <linearGradient id="tools-badge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1b262c" />
      <stop offset="100%" stop-color="#0f4c75" />
    </linearGradient>
  </defs>

  <style>
    @keyframes badgeFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    .card-bg { fill: url(#card-grad); stroke: #30363d; stroke-width: 1.5; }
    .section-title {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      font-size: 14px;
      font-weight: 700;
      fill: #00d4ff;
      letter-spacing: 1px;
    }
    .badge-bg { rx: 8px; stroke: #30363d; stroke-width: 1; }
    .badge-text {
      font-family: 'Segoe UI', sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #ffffff;
    }
    .mobile-fill { fill: url(#mobile-badge); }
    .web-fill    { fill: url(#web-badge); }
    .tools-fill  { fill: url(#tools-badge); }
    .anim-1 { animation: badgeFloat 3.0s infinite ease-in-out; }
    .anim-2 { animation: badgeFloat 3.5s infinite ease-in-out 0.5s; }
    .anim-3 { animation: badgeFloat 4.0s infinite ease-in-out 1.0s; }
    .divider { stroke: #30363d; stroke-width: 1; }
  </style>

  <!-- Container -->
  <rect width="900" height="420" rx="14" class="card-bg" />

  <!-- ── MAIN HEADER ───────────────────────────────────────────────── -->
  <g transform="translate(450, 42)" text-anchor="middle">
    <text font-family="'Segoe UI', sans-serif" font-size="19" font-weight="700" fill="#ffffff" letter-spacing="1">
      &#128295; TECHNICAL SKILLS &amp; STACK
    </text>
    <line x1="-130" y1="12" x2="130" y2="12" stroke="#00d4ff" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- ── GROUP 1: Mobile Development ─────────────────────────────── -->
  <!-- Section Label -->
  <text x="30" y="94" class="section-title">&#128241; MOBILE DEVELOPMENT</text>
  <!-- Badges -->
  <g transform="translate(30, 106)" class="anim-1">
    <g transform="translate(0,0)">
      <rect width="125" height="36" class="badge-bg mobile-fill" />
      <text x="62.5" y="23" text-anchor="middle" class="badge-text">&#9889; Flutter</text>
    </g>
    <g transform="translate(140,0)">
      <rect width="110" height="36" class="badge-bg mobile-fill" />
      <text x="55" y="23" text-anchor="middle" class="badge-text">&#127919; Dart</text>
    </g>
    <g transform="translate(265,0)">
      <rect width="155" height="36" class="badge-bg mobile-fill" />
      <text x="77.5" y="23" text-anchor="middle" class="badge-text">&#9883;&#65039; React Native</text>
    </g>
    <g transform="translate(435,0)">
      <rect width="130" height="36" class="badge-bg mobile-fill" />
      <text x="65" y="23" text-anchor="middle" class="badge-text">&#129302; Android</text>
    </g>
    <g transform="translate(580,0)">
      <rect width="120" height="36" class="badge-bg mobile-fill" />
      <text x="60" y="23" text-anchor="middle" class="badge-text">&#128346; Kotlin</text>
    </g>
  </g>

  <line x1="30" y1="162" x2="870" y2="162" class="divider" />

  <!-- ── GROUP 2: Web Development ─────────────────────────────────── -->
  <text x="30" y="194" class="section-title">&#127760; WEB DEVELOPMENT</text>
  <g transform="translate(30, 206)" class="anim-2">
    <g transform="translate(0,0)">
      <rect width="115" height="36" class="badge-bg web-fill" />
      <text x="57.5" y="23" text-anchor="middle" class="badge-text">&#9883;&#65039; React</text>
    </g>
    <g transform="translate(130,0)">
      <rect width="125" height="36" class="badge-bg web-fill" />
      <text x="62.5" y="23" text-anchor="middle" class="badge-text">&#9650; Next.js</text>
    </g>
    <g transform="translate(270,0)">
      <rect width="145" height="36" class="badge-bg web-fill" />
      <text x="72.5" y="23" text-anchor="middle" class="badge-text">&#128311; TypeScript</text>
    </g>
    <g transform="translate(430,0)">
      <rect width="140" height="36" class="badge-bg web-fill" />
      <text x="70" y="23" text-anchor="middle" class="badge-text">JS JavaScript</text>
    </g>
    <g transform="translate(585,0)">
      <rect width="125" height="36" class="badge-bg web-fill" />
      <text x="62.5" y="23" text-anchor="middle" class="badge-text">&#128994; Node.js</text>
    </g>
  </g>

  <line x1="30" y1="262" x2="870" y2="262" class="divider" />

  <!-- ── GROUP 3: Design, Tools & Platforms ──────────────────────── -->
  <text x="30" y="294" class="section-title">&#127912; DESIGN, TOOLS &amp; PLATFORMS</text>
  <g transform="translate(30, 306)" class="anim-3">
    <g transform="translate(0,0)">
      <rect width="145" height="36" class="badge-bg tools-fill" />
      <text x="72.5" y="23" text-anchor="middle" class="badge-text">&#127912; Tailwind CSS</text>
    </g>
    <g transform="translate(160,0)">
      <rect width="110" height="36" class="badge-bg tools-fill" />
      <text x="55" y="23" text-anchor="middle" class="badge-text">&#127912; Figma</text>
    </g>
    <g transform="translate(285,0)">
      <rect width="100" height="36" class="badge-bg tools-fill" />
      <text x="50" y="23" text-anchor="middle" class="badge-text">&#127807; Git</text>
    </g>
    <g transform="translate(400,0)">
      <rect width="130" height="36" class="badge-bg tools-fill" />
      <text x="65" y="23" text-anchor="middle" class="badge-text">&#128293; Firebase</text>
    </g>
    <g transform="translate(545,0)">
      <rect width="130" height="36" class="badge-bg tools-fill" />
      <text x="65" y="23" text-anchor="middle" class="badge-text">&#128187; VS Code</text>
    </g>
    <g transform="translate(690,0)">
      <rect width="115" height="36" class="badge-bg tools-fill" />
      <text x="57.5" y="23" text-anchor="middle" class="badge-text">&#128039; Linux</text>
    </g>
  </g>
</svg>
