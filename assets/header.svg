<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="220">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#00ff88" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.6; filter: drop-shadow(0 0 8px #00d4ff); }
      50% { opacity: 1; filter: drop-shadow(0 0 18px #7c3aed); }
    }
    @keyframes slideGradient {
      0% { stroke-dashoffset: 900; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) scale(1); opacity: 0.3; }
      50% { transform: translateY(-12px) scale(1.2); opacity: 0.8; }
    }
    @keyframes typingText {
      0% { opacity: 0; transform: translateY(6px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .bg-rect { fill: url(#bg-grad); rx: 16px; }
    .title-text { font-family: 'Fira Code', 'Segoe UI', monospace, sans-serif; font-size: 42px; font-weight: 800; fill: #ffffff; animation: pulseGlow 4s infinite ease-in-out; }
    .subtitle-text { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 18px; font-weight: 600; fill: #00d4ff; letter-spacing: 2px; }
    .tag-text { font-family: 'Fira Code', monospace; font-size: 13px; fill: #8b949e; }
    .border-line { stroke: url(#accent-grad); stroke-width: 3; stroke-dasharray: 900; animation: slideGradient 3s ease-out forwards; }
    .particle { fill: #00d4ff; animation: floatParticle 3s infinite ease-in-out; }
    .p2 { fill: #7c3aed; animation-delay: 1.5s; }
    .p3 { fill: #00ff88; animation-delay: 0.8s; }
  </style>

  <!-- Main Background Container -->
  <rect width="900" height="220" class="bg-rect" stroke="#30363d" stroke-width="1.5" />

  <!-- Animated Particles -->
  <circle cx="80" cy="50" r="3" class="particle p1" />
  <circle cx="820" cy="170" r="4" class="particle p2" />
  <circle cx="750" cy="40" r="3" class="particle p3" />
  <circle cx="150" cy="180" r="2.5" class="particle p2" />

  <!-- Top Accent Bar -->
  <line x1="30" y1="20" x2="870" y2="20" class="border-line" />

  <!-- Center Content -->
  <g transform="translate(450, 105)" text-anchor="middle">
    <!-- Main Title -->
    <text y="-10" class="title-text">NABHAN USMAN</text>
    
    <!-- Subtitle -->
    <text y="30" class="subtitle-text">SOFTWARE DEVELOPER</text>

    <!-- Tech Badges Line -->
    <text y="62" class="tag-text">⚡ MOBILE DEV &#160;•&#160; 🌐 WEB DEV &#160;•&#160; 🎨 SLEEK UI ARCHITECT</text>
  </g>

  <!-- Bottom Accent Bar -->
  <line x1="30" y1="200" x2="870" y2="200" class="border-line" />
</svg>
