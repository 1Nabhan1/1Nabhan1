name: 📊 Generate GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"   # Daily at midnight UTC
  workflow_dispatch:        # Manual trigger
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:

      # ── GitHub Stats Overview ──────────────────────────────────────────────
      - name: 📈 GitHub Stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: 1Nabhan1
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Kolkata
          filename: assets/metrics/stats.svg
          output_action: commit
          committer_branch: main
          committer_message: "📊 Update GitHub stats"

      # ── Top Languages ──────────────────────────────────────────────────────
      - name: 🗣️ Top Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: 1Nabhan1
          base: ""
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_colors: github
          plugin_languages_threshold: 0%
          filename: assets/metrics/languages.svg
          output_action: commit
          committer_branch: main
          committer_message: "📊 Update languages"

      # ── Recent Activity ────────────────────────────────────────────────────
      - name: ⚡ Activity Graph
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: 1Nabhan1
          base: ""
          plugin_activity: yes
          plugin_activity_limit: 7
          plugin_activity_days: 14
          plugin_activity_filter: all
          filename: assets/metrics/activity.svg
          output_action: commit
          committer_branch: main
          committer_message: "📊 Update activity"

      # ── Achievements / Trophies ────────────────────────────────────────────
      - name: 🏆 Achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: 1Nabhan1
          base: ""
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_display: compact
          filename: assets/metrics/achievements.svg
          output_action: commit
          committer_branch: main
          committer_message: "📊 Update achievements"
